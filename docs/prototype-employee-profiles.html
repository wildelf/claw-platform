<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字员工 - Claw Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #161b22; border-right: 1px solid #30363d; padding: 20px 0; flex-shrink: 0; }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #30363d; margin-bottom: 16px; font-size: 18px; font-weight: 700; color: #58a6ff; }
    .sidebar-logo span { color: #8b949e; font-weight: 400; font-size: 12px; display: block; margin-top: 4px; }
    .nav-section { padding: 8px 16px; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 20px; color: #8b949e; text-decoration: none; font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .nav-item:hover { background: #1c2129; color: #e6edf3; }
    .nav-item.active { background: #1c2129; color: #58a6ff; border-right: 2px solid #58a6ff; }
    .main { flex: 1; padding: 32px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .page-title { font-size: 24px; font-weight: 600; }
    .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #238636; border-color: #238636; }
    .btn-primary:hover { background: #2ea043; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; transition: all 0.2s; }
    .card:hover { border-color: #58a6ff; box-shadow: 0 0 0 1px #58a6ff30; }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #58a6ff, #3fb950); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #fff; flex-shrink: 0; }
    .card-name { font-size: 16px; font-weight: 600; }
    .card-role { font-size: 13px; color: #8b949e; }
    .card-goal { font-size: 13px; color: #8b949e; margin-bottom: 16px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 12px; }
    .badge-active { background: #3fb95020; color: #3fb950; }
    .badge-paused { background: #d2992220; color: #d29922; }
    .badge-retired { background: #8b949e20; color: #8b949e; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .card-actions { display: flex; gap: 8px; }
    .search-bar { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; color: #e6edf3; font-size: 14px; width: 240px; }
    .search-bar:focus { outline: none; border-color: #58a6ff; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">Claw Platform <span>AI Digital Employees</span></div>
      <div class="nav-section">数字员工</div>
      <a class="nav-item active">员工列表</a>
      <a class="nav-item">新建员工</a>
      <div class="nav-section">运维</div>
      <a class="nav-item">Worker 面板</a>
      <a class="nav-item">任务管理</a>
      <div class="nav-section">系统</div>
      <a class="nav-item">设置</a>
    </aside>
    <main class="main">
      <div class="page-header">
        <h1 class="page-title">数字员工</h1>
        <div class="header-actions">
          <input class="search-bar" type="text" placeholder="搜索员工...">
          <button class="btn btn-primary">+ 新建员工</button>
        </div>
      </div>
      <div class="grid">
        <div class="card">
          <div class="card-header"><div class="avatar">张</div><div><div class="card-name">张三</div><div class="card-role">AI 客服专员</div></div></div>
          <div class="card-goal">高效处理客户咨询和投诉，提升客户满意度至 95% 以上</div>
          <div class="card-footer"><span class="badge badge-active"><span class="badge-dot"></span>活跃</span><div class="card-actions"><button class="btn btn-sm">查看</button><button class="btn btn-sm">编辑</button></div></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="avatar" style="background:linear-gradient(135deg,#a371f7,#f778ba)">李</div><div><div class="card-name">李四</div><div class="card-role">AI 数据分析师</div></div></div>
          <div class="card-goal">分析业务数据，生成周报和月报，识别增长机会</div>
          <div class="card-footer"><span class="badge badge-active"><span class="badge-dot"></span>活跃</span><div class="card-actions"><button class="btn btn-sm">查看</button><button class="btn btn-sm">编辑</button></div></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="avatar" style="background:linear-gradient(135deg,#d29922,#f0883e)">王</div><div><div class="card-name">王五</div><div class="card-role">AI 内容运营</div></div></div>
          <div class="card-goal">负责社交媒体内容策划和发布，提升品牌曝光度</div>
          <div class="card-footer"><span class="badge badge-paused"><span class="badge-dot"></span>暂停</span><div class="card-actions"><button class="btn btn-sm">查看</button><button class="btn btn-sm">编辑</button></div></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="avatar" style="background:linear-gradient(135deg,#8b949e,#6e7681)">赵</div><div><div class="card-name">赵六</div><div class="card-role">AI 代码审查员</div></div></div>
          <div class="card-goal">审查代码质量，发现潜在 Bug，提出优化建议</div>
          <div class="card-footer"><span class="badge badge-retired"><span class="badge-dot"></span>已退休</span><div class="card-actions"><button class="btn btn-sm">查看</button><button class="btn btn-sm">编辑</button></div></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
